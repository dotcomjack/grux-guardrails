name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Package.swift declares .macOS(.v13), so CI has to run the DECLARED MINIMUM and not
    # only the newest runner. This matters more here than it would in most packages:
    # testEveryUnicodeSpellingOfALoopbackHostIsDenied defends against a loopback SSRF
    # bypass, and its own comment says the only thing standing between this library and
    # that bypass is a Foundation implementation detail. macOS 15 ships the rewritten
    # swift-foundation URL parser; 13 and 14 ship the older one, whose URL.host may not
    # apply the same UTS46 mapping. Testing only macos-15 would let that difference reach
    # a consumer on the minimum we advertise, with no CI leg able to see it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is DELIBERATELY ABSENT. It was added here on 2026-08-13 to test the
        # declared minimum, and it never scheduled: 31 minutes queued while 14 and 15
        # finished in about 2, and it held BOTH runs in "queued" so CI could never reach a
        # conclusion at all. GitHub is retiring the macOS 13 Intel hosted runner. A leg
        # that can never report is not coverage, it just looks like coverage on the checks
        # page, which is worse than no leg.
        #
        # So the homograph loopback defence in testEveryUnicodeSpellingOfALoopbackHostIsDenied
        # is PROVEN on 14 and 15 and UNVERIFIED on 13, which the package still declares as
        # its minimum. macOS 14 passing is real evidence, since 14 ships the same older
        # Foundation URL parser the concern was about. Resolving that claim properly is
        # either raising the platform to .macOS(.v14) or normalising alternate dot
        # characters inside URLGuard instead of trusting Foundation, and both ship as 0.6.1.
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Em dashes and en dashes are banned in this repo, including in comments and
      # docs. Cheap to check, annoying to fix after the fact.
      - name: No em dashes or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.swift' --include='*.md' --include='*.yml' .; then
            echo "::error::found an em dash or en dash, use a comma, colon or full stop"
            exit 1
          fi
          echo "clean"
