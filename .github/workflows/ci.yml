name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref instead of paying for all of them. This repo
# is the most expensive CI in the account and the reason is the matrix below: every run
# starts TWO macOS jobs, and a macOS minute bills at 10x a Linux minute. Measured over
# Aug 1 to 14 2026 this repo alone was $3.87 of $13.89 total across ten repos, on only
# 41 runs, and those runs arrived in bursts of 8, 13 and 14 in a single day. A burst is
# rapid successive pushes to the same branch, so every run but the last was already
# obsolete before it finished, and each one was billed at the macOS rate anyway.
#
# cancel-in-progress is true for pushes to main as well as pull requests, which is the
# deliberate half. The last push in a burst is never cancelled, so the final state of
# main is always fully tested; what is given up is a per-commit green tick on the
# intermediate commits of a burst. Re-run a specific commit from the Actions tab if one
# ever needs its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Neither job writes anything back to the repository,
# so read access to the contents is the whole requirement. Without this block both jobs
# inherit the repository default, which is broader than either one needs.
permissions:
  contents: read

jobs:
  test:
    # Package.swift declares .macOS(.v14), so macos-14 IS the declared minimum and CI has
    # to run it rather than only the newest runner. This matters more here than it would
    # in most packages:
    # testEveryUnicodeSpellingOfALoopbackHostIsDenied defends against a loopback SSRF
    # bypass, and its own comment says the only thing standing between this library and
    # that bypass is a Foundation implementation detail. macOS 15 ships the rewritten
    # swift-foundation URL parser; 13 and 14 ship the older one, whose URL.host may not
    # apply the same UTS46 mapping. Testing only macos-15 would let that difference reach
    # a consumer on the minimum we advertise, with no CI leg able to see it.
    runs-on: ${{ matrix.os }}
    # GitHub's default job timeout is 360 minutes. On a macOS runner that is $28.80 for
    # a single stuck job, which is more than twice this repo's entire measured spend for
    # the first half of August. This is not hypothetical here: the macos-13 note below
    # records a leg that sat for 31 minutes and blocked both siblings from ever
    # concluding. swift build plus swift test finishes in about 2 minutes, so 20 is
    # already an order of magnitude of headroom and anything past it is a hang, not a
    # slow run. Queue time does not count against this; the clock starts when the job
    # starts executing.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is DELIBERATELY ABSENT, do not add it back. It was added here on
        # 2026-08-13 to test the minimum declared at the time, and it never scheduled:
        # 31 minutes queued while 14 and 15 finished in about 2, and it held BOTH runs
        # in "queued" so CI could never reach a conclusion at all. GitHub is retiring
        # the macOS 13 Intel hosted runner. A leg that can never report is not
        # coverage, it just looks like coverage on the checks page, which is worse than
        # no leg.
        #
        # That left the homograph loopback defence in
        # testEveryUnicodeSpellingOfALoopbackHostIsDenied proven on 14 and 15 and
        # unverified on 13, while the package still declared 13 as its minimum. 0.6.1
        # closed that gap from the other end by raising the floor to .macOS(.v14), so
        # the declared minimum is now macos-14 and this matrix covers it head on. The
        # question is settled, not outstanding.
        os: [macos-14, macos-15]
    steps:
      # Pinned to a full commit SHA, not the v4 tag. A tag is mutable and can be
      # repointed by whoever controls the action repository, which makes it a supply
      # chain hole in a package that argues for guardrails. The trailing comment is the
      # human readable version the SHA corresponds to, so this stays maintainable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  house-style:
    runs-on: ubuntu-latest
    # A grep over the tree. If this has not finished in 10 minutes it is wedged.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Em dashes and en dashes are banned in this repo, including in comments and
      # docs. Cheap to check, annoying to fix after the fact.
      # json is in the list because docs/advisories/*.json carry advisory bodies that
      # get published verbatim as GitHub Security Advisories. Prose in a data file is
      # still prose, and it was outside this check until the advisories landed.
      - name: No em dashes or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.swift' --include='*.md' --include='*.yml' --include='*.json' .; then
            echo "::error::found an em dash or en dash, use a comma, colon or full stop"
            exit 1
          fi
          echo "clean"
